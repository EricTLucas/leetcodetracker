<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LeetCode Tracker</title>

    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            color: #ffffff;
        }

        #stats {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .stat-box {
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 8px;
            width: 220px;
            text-align: center;
            box-shadow: 0 0 10px #00000055;
        }

        #problems-list {
            margin-top: 20px;
        }

        .problem-item {
            background-color: #2b2b2b;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.2s ease;
            cursor: pointer;
        }

        .problem-item:hover {
            background-color: #3a3a3a;
            transform: scale(1.02);
        }

        .problem-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .problem-meta {
            font-size: 14px;
            color: #c0c0c0;
        }
        .circle-container {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }

        .circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                conic-gradient(
                    #4caf50 calc(var(--pct) * 1%),
                    #444 calc(var(--pct) * 1%)
                );
            position: relative;
            box-shadow: 0 0 10px #00000055;
            transition: transform 0.2s ease;
        }

        .circle:hover {
            transform: scale(1.08);
        }

        .circle-inner {
            width: 65%;
            height: 65%;
            background-color: #1e1e1e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-align: center;
            padding: 5px;
            color: #e0e0e0;
        }

    </style>

   
</head>

<body>
    <h1>LeetCode Tracker</h1>

    <div id="stats">
        <div>Total Unique Solved: <span id="total-unique"></span></div>
        <div>Solved This Week: <span id="solved-week"></span></div>
    </div>

    <h2>Recent Problems</h2>
    <div id="problems"></div>
