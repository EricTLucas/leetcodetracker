<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Problem Detail</title>

    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: Arial;
            padding: 20px;
        }

        .circle-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background:
                conic-gradient(
                    #4caf50 calc(var(--pct) * 1%),
                    #444 calc(var(--pct) * 1%)
                );
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-inner {
            width: 70%;
            height: 70%;
            background-color: #1e1e1e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        pre {
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>

</head>

<body>
    <h1 id="title">Loading...</h1>

    <div id="meta"></div>

    <h2>Code</h2>
    <pre id="code"></pre>

    <h2>Runtime & Memory</h2>
    <div id="stats"></div>

    <!-- Firebase COMPAT scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Your Firebase config -->
    <script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "leetcode-tracker-7815e.firebaseapp.com",
        projectId: "leetcode-tracker-7815e",
        storageBucket: "leetcode-tracker-7815e.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    </script>

    <script src="problem.js?v=2"></script>
</body>
</html>
